name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      # The adapters drive a bundled Node MCP sidecar over stdio; the test session spawns it as a
      # real subprocess (tests/conftest.py), so Node is exercised here, not merely installed.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (non-editable, so tests import the built package and not src/)
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Test
        run: pytest -q
